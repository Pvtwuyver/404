<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Bureau — Work in progress</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<style>html,body{margin:0;height:100%;background:#ece6da}three-d-stage:not(:defined){visibility:hidden}</style>
</head>
<body>
<three-d-stage name="bureau-work-in-progress" background="#ece6da"></three-d-stage>
<script src="three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;

let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const rr = (a, b) => a + (b - a) * rnd();

const M = {
  walnut: new THREE.MeshStandardMaterial({ name: 'walnut', color: 0x6b4a32, roughness: 0.6 }),
  steel: new THREE.MeshStandardMaterial({ name: 'steel', color: 0x2f3236, roughness: 0.45, metalness: 0.3 }),
  paper: new THREE.MeshStandardMaterial({ name: 'paper', color: 0xf2ede1, roughness: 0.9 }),
  alu: new THREE.MeshStandardMaterial({ name: 'aluminium', color: 0xc4c7cb, roughness: 0.35, metalness: 0.3 }),
  lamp: new THREE.MeshStandardMaterial({ name: 'lamp_green', color: 0x2e4a40, roughness: 0.4, metalness: 0.2 }),
  bulb: new THREE.MeshStandardMaterial({ name: 'bulb', color: 0xfff3d0, emissive: 0xffd98a, emissiveIntensity: 2 }),
  type: new THREE.MeshStandardMaterial({ name: 'text_orange', color: 0xd9643a, roughness: 0.35, emissive: 0x5a1e08, emissiveIntensity: 0.4 }),
};

const model = new THREE.Group();
model.name = 'bureau_scene';
function mesh(name, geo, mat, parent = model) {
  const m = new THREE.Mesh(geo, mat);
  m.name = name; m.castShadow = true; m.receiveShadow = true;
  parent.add(m); return m;
}

// ---------- Bureau ----------
const W = 1.6, D = 0.8, H = 0.75, T = 0.035;
const desk = new THREE.Group(); desk.name = 'bureau'; model.add(desk);
mesh('bureaublad', new THREE.BoxGeometry(W, T, D), M.walnut, desk).position.y = H - T / 2;
for (const [x, z] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
  mesh('poot', new THREE.BoxGeometry(0.045, H - T, 0.045), M.steel, desk)
    .position.set(x * (W / 2 - 0.05), (H - T) / 2, z * (D / 2 - 0.05));
}
const ladeblok = mesh('ladeblok', new THREE.BoxGeometry(0.42, 0.5, D - 0.12), M.walnut, desk);
ladeblok.position.set(W / 2 - 0.3, H - T - 0.25, 0);
for (let i = 0; i < 3; i++) {
  const y = H - T - 0.09 - i * 0.16;
  mesh('lade_front', new THREE.BoxGeometry(0.38, 0.14, 0.012), M.walnut, desk).position.set(W / 2 - 0.3, y, (D - 0.12) / 2 + 0.006);
  mesh('lade_greep', new THREE.BoxGeometry(0.12, 0.012, 0.02), M.steel, desk).position.set(W / 2 - 0.3, y, (D - 0.12) / 2 + 0.02);
}
mesh('dwarsbalk', new THREE.BoxGeometry(W - 0.1, 0.06, 0.02), M.steel, desk).position.set(0, H - 0.12, -D / 2 + 0.05);

// ---------- Papier-texturen ----------
const sheets = [
  { title: 'Opgave 3 — Kinematica', lines: ['Een bal wordt met v₀ = 12 m/s', 'verticaal omhoog gegooid.', 'a) Bereken de maximale hoogte.', 'b) Na hoeveel seconden is de bal', '    terug op het startpunt?', '', 'h = v₀² / 2g', 'h = 144 / 19,62 ≈ 7,3 m', 't = 2v₀ / g ≈ 2,45 s'] },
  { title: 'Maxwell', lines: ['∇ · E = ρ / ε₀', '∇ · B = 0', '∇ × E = −∂B/∂t', '∇ × B = μ₀J + μ₀ε₀ ∂E/∂t', '', 'c = 1 / √(μ₀ε₀)'] },
  { title: 'Opgave 7 — Slinger', lines: ['Een slinger met lengte L = 0,80 m', 'zwaait met kleine uitwijking.', 'Bepaal de trillingstijd T.', '', 'T = 2π √(L / g)', 'T = 2π √(0,80 / 9,81)', 'T ≈ 1,79 s', '', 'θ(t) = θ₀ cos(ωt + φ)'] },
  { title: 'Integralen', lines: ['∫₀^∞ e^(−x²) dx = √π / 2', '', '∫ x·eˣ dx = (x − 1)eˣ + C', '', 'Σ 1/n² = π² / 6', '', 'lim (1 + 1/n)ⁿ = e', 'e^(iπ) + 1 = 0'] },
  { title: 'Opgave 12 — Energie', lines: ['Een karretje (m = 2,5 kg) rolt', 'zonder wrijving van een helling', 'met hoogte h = 1,6 m.', 'Bereken de snelheid onderaan.', '', 'mgh = ½mv²', 'v = √(2gh) ≈ 5,6 m/s', '', 'E = mc²   ?!'] },
  { title: 'Quantum', lines: ['iħ ∂ψ/∂t = Ĥψ', '', 'Δx · Δp ≥ ħ / 2', '', 'E = hf = ħω', 'λ = h / p', '', '⟨ψ|ψ⟩ = 1'] },
  { title: 'Opgave 5 — Elektriciteit', lines: ['Drie weerstanden van 4 Ω, 6 Ω', 'en 12 Ω staan parallel op 6 V.', 'a) Bereken R_v.', 'b) Bereken de totale stroom.', '', '1/R = 1/4 + 1/6 + 1/12', 'R_v = 2 Ω', 'I = U / R = 3 A'] },
  { title: 'Kladblad', lines: ['F = m · a', 'p = m · v', 'W = F · s · cos α', 'P = dW / dt', '', 'dy/dx = ky  →  y = Ce^(kx)', '', 'sin²x + cos²x = 1', '∮ B · dl = μ₀ I'] },
];
function paperTexture(s, i) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 724;
  const g = c.getContext('2d');
  g.fillStyle = '#f4efe3'; g.fillRect(0, 0, 512, 724);
  g.strokeStyle = 'rgba(80,120,170,0.22)'; g.lineWidth = 1;
  for (let y = 90; y < 724; y += 34) { g.beginPath(); g.moveTo(0, y); g.lineTo(512, y); g.stroke(); }
  g.strokeStyle = 'rgba(200,70,60,0.35)'; g.beginPath(); g.moveTo(56, 0); g.lineTo(56, 724); g.stroke();
  g.fillStyle = '#1f2a44'; g.font = 'bold 28px Georgia, serif'; g.fillText(s.title, 70, 70);
  g.fillStyle = i % 2 ? '#22305a' : '#2a2a2a';
  g.font = 'italic 25px Georgia, serif';
  s.lines.forEach((l, k) => g.fillText(l, 70 + (k % 3) * 2, 120 + k * 34));
  g.strokeStyle = 'rgba(190,40,40,0.7)'; g.lineWidth = 3;
  g.beginPath(); g.ellipse(330, 120 + (s.lines.length - 1) * 34 - 8, 120, 24, -0.05, 0, Math.PI * 2); g.stroke();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return new THREE.MeshStandardMaterial({ name: 'papier_' + (i + 1), map: t, roughness: 0.9 });
}
const sheetMats = sheets.map(paperTexture);

// ---------- Stapels papier ----------
const PW = 0.21, PL = 0.297, PT = 0.0012;
const sheetGeo = new THREE.BoxGeometry(PW, PT, PL);
const top = H + 0.0005;
const papers = new THREE.Group(); papers.name = 'papierstapels'; model.add(papers);
let texIdx = 0;
function stack(x, z, n, mess, name) {
  const g = new THREE.Group(); g.name = name; papers.add(g);
  let y = top + PT / 2, baseRot = rr(-0.4, 0.4);
  for (let i = 0; i < n; i++) {
    const last = i === n - 1 || rnd() < 0.08;
    const m = mesh('vel', sheetGeo, last ? sheetMats[texIdx++ % sheetMats.length] : M.paper, g);
    m.position.set(x + rr(-mess, mess), y, z + rr(-mess, mess));
    m.rotation.set(rr(-0.012, 0.012), baseRot + rr(-mess * 6, mess * 6), rr(-0.012, 0.012));
    y += PT + rr(0, 0.0006);
  }
}
stack(-0.62, -0.18, 70, 0.012, 'stapel_links_achter');
stack(-0.55, 0.14, 38, 0.02, 'stapel_links_voor');
stack(-0.32, -0.24, 52, 0.016, 'stapel_midden_links');
stack(0.36, -0.25, 60, 0.014, 'stapel_rechts_achter');
stack(0.66, -0.12, 85, 0.01, 'stapel_rechts_hoog');
stack(0.64, 0.2, 24, 0.025, 'stapel_rechts_voor');
// losse vellen
const loose = new THREE.Group(); loose.name = 'losse_vellen'; papers.add(loose);
[[-0.2, 0.25, 0.6], [0.33, 0.22, -0.8], [-0.4, 0.05, 1.9], [0.2, 0.3, 0.2], [-0.05, -0.3, 1.2]].forEach(([x, z, r], i) => {
  const m = mesh('los_vel', sheetGeo, sheetMats[(i + 3) % sheetMats.length], loose);
  m.position.set(x, top + PT / 2 + i * 0.0013, z); m.rotation.y = r;
});

// ---------- Laptop ----------
const laptop = new THREE.Group(); laptop.name = 'laptop'; model.add(laptop);
laptop.position.set(0.02, top, 0.04); laptop.rotation.y = -0.08;
const LW = 0.34, LD = 0.235;
mesh('laptop_onderkant', new THREE.BoxGeometry(LW, 0.016, LD), M.alu, laptop).position.y = 0.008;
const keysMat = new THREE.MeshStandardMaterial({ name: 'toetsen', color: 0x1d1f22, roughness: 0.7 });
mesh('toetsenbord', new THREE.BoxGeometry(LW - 0.04, 0.001, 0.1), keysMat, laptop).position.set(0, 0.0165, -0.03);
mesh('touchpad', new THREE.BoxGeometry(0.11, 0.001, 0.065), new THREE.MeshStandardMaterial({ name: 'touchpad', color: 0xb0b3b8, roughness: 0.3 }), laptop).position.set(0, 0.0165, 0.07);
const hinge = new THREE.Group(); hinge.name = 'scharnier'; laptop.add(hinge);
hinge.position.set(0, 0.016, -LD / 2); hinge.rotation.x = -0.32;
mesh('scherm_deksel', new THREE.BoxGeometry(LW, 0.225, 0.007), M.alu, hinge).position.set(0, 0.1125, -0.0035);
{
  const c = document.createElement('canvas'); c.width = 640; c.height = 400;
  const g = c.getContext('2d');
  g.fillStyle = '#14191f'; g.fillRect(0, 0, 640, 400);
  g.strokeStyle = 'rgba(255,255,255,0.08)';
  for (let x = 40; x < 640; x += 40) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 400); g.stroke(); }
  for (let y = 40; y < 400; y += 40) { g.beginPath(); g.moveTo(0, y); g.lineTo(640, y); g.stroke(); }
  g.strokeStyle = '#f08a4b'; g.lineWidth = 4; g.beginPath();
  for (let x = 0; x <= 640; x += 4) { const y = 200 - 140 * Math.exp(-x / 400) * Math.sin(x / 28); x ? g.lineTo(x, y) : g.moveTo(x, y); }
  g.stroke();
  g.fillStyle = '#e8e2d4'; g.font = '22px monospace'; g.fillText('x(t) = A·e^(−γt)·sin(ωt)', 24, 370);
  g.fillText('gedempte trilling', 24, 36);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const scr = new THREE.MeshStandardMaterial({ name: 'scherm', color: 0x000000, emissive: 0xffffff, emissiveMap: t, emissiveIntensity: 1, roughness: 0.2 });
  const s = mesh('scherm', new THREE.PlaneGeometry(LW - 0.02, 0.2), scr, hinge);
  s.position.set(0, 0.113, 0.0003);
}

// ---------- Bureaulamp ----------
const lampG = new THREE.Group(); lampG.name = 'bureaulamp'; model.add(lampG);
lampG.position.set(0.38, top, 0.12);
mesh('lamp_voet', new THREE.CylinderGeometry(0.075, 0.085, 0.022, 48), M.lamp, lampG).position.y = 0.011;
const p0 = new THREE.Vector3(0, 0.022, 0), p1 = new THREE.Vector3(0.04, 0.32, -0.03), p2 = new THREE.Vector3(-0.17, 0.44, -0.02);
function rod(name, a, b, r) {
  const len = a.distanceTo(b);
  const m = mesh(name, new THREE.CylinderGeometry(r, r, len, 24), M.lamp, lampG);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
}
rod('lamp_arm_onder', p0, p1, 0.009);
rod('lamp_arm_boven', p1, p2, 0.008);
mesh('lamp_gewricht', new THREE.SphereGeometry(0.016, 32, 16), M.steel, lampG).position.copy(p1);
mesh('lamp_gewricht', new THREE.SphereGeometry(0.014, 32, 16), M.steel, lampG).position.copy(p2);
const head = new THREE.Group(); head.name = 'lampkap_groep'; lampG.add(head);
head.position.copy(p2); head.rotation.z = 0.75;
const shadeProfile = [];
for (let i = 0; i <= 20; i++) { const t = i / 20; shadeProfile.push(new THREE.Vector2(0.03 + 0.06 * Math.pow(t, 1.6), -t * 0.11)); }
const shadeMat = M.lamp.clone(); shadeMat.name = 'lampkap'; shadeMat.side = THREE.DoubleSide;
mesh('lampkap', new THREE.LatheGeometry(shadeProfile, 48), shadeMat, head);
mesh('lampkap_top', new THREE.SphereGeometry(0.03, 32, 12, 0, Math.PI * 2, 0, Math.PI / 2), M.lamp, head);
const bulb = mesh('lampje', new THREE.SphereGeometry(0.024, 32, 16), M.bulb, head);
bulb.position.y = -0.045; bulb.castShadow = false;
const spot = new THREE.SpotLight(0xffd59a, 9, 0.75, 0.75, 0.55, 1.4);
spot.name = 'lamplicht'; spot.castShadow = true; spot.shadow.mapSize.set(1024, 1024); spot.shadow.bias = -0.0005; spot.shadow.camera.near = 0.02; spot.shadow.camera.far = 0.7;
spot.position.set(0, -0.05, 0); head.add(spot);
const tgt = new THREE.Object3D(); tgt.position.set(0, -1, 0); head.add(tgt); spot.target = tgt;
const glow = new THREE.PointLight(0xffd59a, 0.25, 0.4, 2); glow.position.set(0, -0.06, 0); head.add(glow);

// ---------- Zwevende tekst ----------
const FONT = {
  W: [[[0,6],[1,0],[2,4],[3,0],[4,6]]],
  O: [[[1,0],[3,0],[4,1],[4,5],[3,6],[1,6],[0,5],[0,1],[1,0]]],
  R: [[[0,0],[0,6],[3,6],[4,5],[4,4],[3,3],[0,3]], [[2,3],[4,0]]],
  K: [[[0,0],[0,6]], [[4,6],[0,2.4]], [[1.4,3.5],[4,0]]],
  I: [[[2,0],[2,6]], [[1,0],[3,0]], [[1,6],[3,6]]],
  N: [[[0,0],[0,6],[4,0],[4,6]]],
  P: [[[0,0],[0,6],[3,6],[4,5],[4,4],[3,3],[0,3]]],
  G: [[[4,5],[3,6],[1,6],[0,5],[0,1],[1,0],[3,0],[4,1],[4,3],[2.2,3]]],
  E: [[[4,6],[0,6],[0,0],[4,0]], [[0,3],[3,3]]],
  S: [[[4,5],[3,6],[1,6],[0,5],[0,4],[1,3],[3,3],[4,2],[4,1],[3,0],[1,0],[0,1]]],
};
const text = 'WORK IN PROGRESS', s = 0.022, R = 0.0075, adv = 0.135, spaceAdv = 0.09;
const textG = new THREE.Group(); textG.name = 'tekst_work_in_progress'; model.add(textG);
const jointGeo = new THREE.SphereGeometry(R, 24, 12);
let cx = 0;
for (const ch of text) {
  if (ch === ' ') { cx += spaceAdv; continue; }
  const L = new THREE.Group(); L.name = 'letter_' + ch; L.position.x = cx; textG.add(L);
  for (const line of FONT[ch]) {
    const pts = line.map(([x, y]) => new THREE.Vector3(x * s, y * s, 0));
    pts.forEach(p => { const j = mesh('hoek', jointGeo, M.type, L); j.position.copy(p); });
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1], len = a.distanceTo(b);
      const m = mesh('streep', new THREE.CylinderGeometry(R, R, len, 24), M.type, L);
      m.position.copy(a).add(b).multiplyScalar(0.5);
      m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
    }
  }
  cx += adv;
}
const textWidth = cx - adv + 4 * s;
textG.position.set(-textWidth / 2, H + 0.62, -0.05);
textG.rotation.x = -0.12;

stage.setObject(model);

// zacht zweven
const baseY = textG.position.y;
(function bob(t) { textG.position.y = baseY + Math.sin(t / 900) * 0.012; requestAnimationFrame(bob); })(0);
</script>
</body>
</html>
